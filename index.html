<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Analyzer has moved</title>
<link rel="canonical" href="https://berklee.bryandimaio.com/scheduler/analyzer/">
<meta http-equiv="refresh" content="0; url=https://berklee.bryandimaio.com/scheduler/analyzer/">
<script>
// The Analyzer is now served by the Scheduler. Carry over only the department
// choice; anything else in the old address (sign-in codes in the fragment) is
// meaningless at the new one and is dropped.
(function () {
  var target = new URL('https://berklee.bryandimaio.com/scheduler/analyzer/');
  var department = new URLSearchParams(location.search).get('department');
  if (department && /^\d+$/.test(department)) target.searchParams.set('department', department);
  location.replace(target.toString());
})();
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FCF9F1; color: #111;
         min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 24px; }
  main { max-width: 440px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { font-size: 15px; line-height: 1.5; color: #3d3a34; margin: 0 0 16px; }
  a { color: #C81830; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Attendance Analyzer has moved</h1>
  <p>It now lives inside the Berklee Assistant Scheduling System.</p>
  <p><a href="https://berklee.bryandimaio.com/scheduler/analyzer/">Open the Attendance Analyzer</a></p>
</main>
</body>
</html>
